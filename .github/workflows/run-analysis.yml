name: Run analysis and (optionally) update data

on:
  workflow_dispatch:
    inputs:
      update_data:
        description: 'If true, re-download WDI indicator CSVs and commit them (default: false)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 6 * * 1' # weekly on Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output dirs
        run: |
          mkdir -p figures

      - name: Optionally update raw WDI CSVs
        if: ${{ github.event.inputs.update_data == 'true' }}
        run: |
          python data/fetch_wdi.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if ! git diff --staged --quiet; then
            git commit -m "Update raw WDI CSVs [skip ci]"
            git push
          else
            echo "No changes to raw CSVs"
          fi

      - name: Run merge script
        run: python load_and_merge.py
